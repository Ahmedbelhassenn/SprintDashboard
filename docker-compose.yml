services:
  backend:
    image: sprintdash-backend:latest
    ports:
      - "8085:8081"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    image: sprintdash-frontend:latest
    ports:
      - "4200:80"
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
